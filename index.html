<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6650a4">
  <title>OSportMobile Lite</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <!-- Главный экран: одна запись — активное событие -->
    <section class="screen" id="homeScreen">
      <header class="page-head">
        <h1>События</h1>
        <button id="openCloud" class="icon-button" title="Облако"><svg class="icon" aria-hidden="true"><use href="icons.svg#cloud"></use></svg></button>
      </header>
      <div class="events-list" id="eventsList"></div>
      <p class="hint" id="homeHint">События нет: откройте облако и скачайте событие.</p>
    </section>

    <!-- Экран дистанции -->
    <section class="screen hidden" id="detailScreen">
      <header class="page-head">
        <button id="detailBack" class="icon-button left" title="Назад"><svg class="icon" aria-hidden="true"><use href="icons.svg#back"></use></svg></button>
        <div class="head-text">
          <h1 id="detailTitle">Событие</h1>
          <p class="sub" id="detailSub"></p>
        </div>
      </header>

      <div class="detail-rows" id="detailRows"></div>

      <div class="actions">
        <button id="detailMark" class="button" style="width:100%">Отметить</button>
        <button id="detailSend" class="button tonal" style="width:100%">Отправить отметки</button>
      </div>
    </section>

    <!-- Облако -->
    <section class="screen hidden" id="cloudScreen">
      <header class="page-head">
        <button id="cloudBack" class="icon-button left" title="Назад"><svg class="icon" aria-hidden="true"><use href="icons.svg#back"></use></svg></button>
        <h1>Дистанции в облаке</h1>
        <button id="cloudRefresh" class="icon-button" title="Обновить"><svg class="icon" aria-hidden="true"><use href="icons.svg#refresh"></use></svg></button>
      </header>

      <div class="search">
        <span class="search-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#search"></use></svg></span>
        <input id="cloudSearch" class="search-input" type="text" inputmode="numeric" placeholder="Поиск по номеру">
      </div>

      <p class="meta" id="cloudHint">Загружаю список…</p>
      <div class="cloud-list" id="cloudList"></div>
    </section>

    <!-- Отметка -->
    <section class="screen hidden" id="markScreen">
      <div class="mark-top">
        <h2 class="mark-title" id="markTitle">Событие</h2>
        <p class="mark-sub" id="markAccuracy">Координаты пока не получены</p>
        <p class="mark-ready hidden" id="markReady"></p>
        <p class="mark-mode">Отметка ручная</p>
      </div>

      <div class="mark-center">
        <button id="bigMark" class="mark-circle" disabled>
          <span id="markButtonLabel">Подойдите к пункту</span>
        </button>
      </div>

      <p class="mark-hint" id="markHint">Кнопка станет зелёной у пункта — тогда нажмите</p>
    </section>

    <!-- Профиль -->
    <section class="screen hidden" id="profileScreen">
      <header class="page-head">
        <h1>Профиль</h1>
      </header>
      <div class="card">
        <label class="label" for="nick">Ник</label>
        <input id="nick" class="input" type="text" placeholder="Ник">
        <label class="label" for="code" style="margin-top:12px">Код профиля</label>
        <input id="code" class="input" type="text" placeholder="12 знаков">
        <p class="hint">Код виден в приложении на вкладке «Профиль».</p>
      </div>
      <div class="card">
        <button id="send" class="button" style="width:100%">Отправить результат</button>
        <p class="hint" id="sendHint">Сначала отметьте финиш на дистанции.</p>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>
  </main>

  <nav class="bottom-bar">
    <button class="tab active" id="tabEvents"><span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#home"></use></svg></span><span class="tab-label">События</span></button>
    <button class="tab" id="tabMark"><span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#list"></use></svg></span><span class="tab-label">Отметить</span></button>
    <button class="tab" id="tabProfile"><span class="tab-icon"><svg class="icon" aria-hidden="true"><use href="icons.svg#person"></use></svg></span><span class="tab-label">Профиль</span></button>
  </nav>

  <script src="marking.js"></script>
  <script src="app.js"></script>
</body>
</html>
