<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6650a4">
  <title>OSportMobile Lite</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Верхняя строка как в приложении: название события становится заголовком -->
  <header class="top">
    <div>
      <h1 id="screenTitle">OSportMobile Lite</h1>
      <p class="sub" id="screenSub">Участнику: скачать событие, отметиться, отправить</p>
    </div>
  </header>

  <main>
    <!-- Шаг 1: найти событие по номеру -->
    <section class="card" id="findCard">
      <label class="label" for="number">Номер события</label>
      <div class="row">
        <input id="number" class="input" type="text" inputmode="numeric" placeholder="12" autocomplete="off">
        <button id="find" class="button">Найти</button>
      </div>
      <p class="hint" id="findHint">Номер виден на карточке события в приложении организатора.</p>
    </section>

    <!-- Шаг 2: карточка найденного события -->
    <section class="card hidden" id="eventCard">
      <div class="row space">
        <h2 class="title" id="eventName">—</h2>
        <span class="badge" id="eventNumber"></span>
      </div>
      <p class="meta" id="eventOrganizer"></p>
      <p class="meta" id="eventPeriod"></p>
      <p class="meta" id="eventDetails"></p>

      <div class="row" style="margin-top:12px">
        <button id="download" class="button" style="flex:1">Скачать событие</button>
        <button id="openMark" class="button tonal" disabled>Отметки</button>
      </div>
      <p class="hint" id="eventHint"></p>
    </section>

    <!-- Шаг 3: отметки. Раскладка повторяет экран приложения:
         название события, время, большая кнопка, список пунктов -->
    <section class="card hidden" id="markCard">
      <div class="row space">
        <h2 class="title" id="markTitle">Отметки</h2>
        <span class="badge" id="markBadge"></span>
      </div>
      <p class="meta" id="marksSummary">Пока ничего не отмечено</p>
      <p class="hint" id="markPeriod"></p>

      <button id="bigMark" class="mark-button" style="margin-top:16px">Старт</button>
      <p class="hint" id="markHint"></p>
      <p class="hint" id="markPosition"></p>

      <div id="pointsList" class="points"></div>

      <div class="row" style="margin-top:12px">
        <button id="finishBtn" class="button tonal" style="flex:1" disabled>Финиш</button>
      </div>

      <div class="card hidden" id="sendCard" style="background:transparent;padding:0;margin-top:16px">
        <p class="label">Кто отправил</p>
        <input id="nick" class="input" type="text" placeholder="Ник">
        <input id="code" class="input" type="text" placeholder="Код профиля (12 знаков)" style="margin-top:8px">
        <button id="send" class="button" style="margin-top:12px;width:100%">Отправить результат</button>
        <p class="hint">Код профиля виден в приложении на вкладке «Профиль».</p>
      </div>
    </section>

    <p class="status" id="status" role="status"></p>
  </main>

  <footer class="bottom">
    <span>OSportMobile Lite</span>
    <span id="version">каркас</span>
  </footer>

  <script src="marking.js"></script>
  <script src="app.js"></script>
</body>
</html>
